# TickerTap containerized web tier — serves the built frontend SPA and
# reverse-proxies API/health traffic to the `app` container.
#
# TLS is intentionally NOT handled here: Cloudflare Tunnel terminates TLS at
# Cloudflare's edge and forwards plain HTTP to this container over the
# tickertap_net Docker network. There is no direct internet path to this
# container's port — cloudflared is the only ingress.
#
# Security headers are preserved from the previous host-nginx config
# (nginx/tickerTap.conf) since Cloudflare passes the client request through;
# HSTS/CSP/etc. still apply to what the browser receives.

# ── Canonical host redirect ───────────────────────────────────────────────
# The frontend is built with VITE_API_URL=https://ticker-tap.com (bare
# apex, no www) baked in at build time. Its CSP `connect-src 'self'` only
# matches the exact origin the page was loaded from. If a browser lands on
# https://www.ticker-tap.com, every fetch to the bare-apex API is a
# different origin and gets blocked by CSP (blank dashboard, "Failed to
# fetch" everywhere). Force www -> apex so users always end up on the
# origin the CSP/API config actually expects.
server {
    listen 80;
    server_name www.ticker-tap.com;
    return 301 https://ticker-tap.com$request_uri;
}

server {
    # default_server is required here: neither block above matches by name
    # for a request whose Host header is anything else (a bare IP, the
    # Docker HEALTHCHECK's http://127.0.0.1/, or cloudflared health probes).
    # Without it, nginx falls back to whichever server block is declared
    # first for this listen socket — which was the www redirect above,
    # sending the healthcheck into a 301 it doesn't follow and marking the
    # container permanently unhealthy even though real traffic (which always
    # arrives with a real Host header) was unaffected.
    listen 80 default_server;
    server_name ticker-tap.com _;

    root  /usr/share/nginx/html;
    index index.html;

    # NOTE: nginx's add_header only inherits into a location block if that
    # location defines NO add_header of its own. Since /assets/ and /
    # below set their own Cache-Control, these security headers are
    # re-included there explicitly via security-headers.conf so they are
    # not silently dropped for those responses.
    include security-headers.conf;

    client_max_body_size 1m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    90s;

    # ── API routes → FastAPI backend (container-to-container) ───────────────
    location /api/ {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Google OAuth callback — never log its query string ──────────────────
    # The one-time authorization code and state arrive as query parameters.
    # They are useless without the server-side client secret + PKCE verifier
    # and expire within minutes, but they still don't belong in access logs.
    location = /api/v1/integrations/google/callback {
        access_log         off;
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Health check → FastAPI backend ───────────────────────────────────────
    location = /health {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Static assets (JS/CSS chunks with content hash) ──────────────────────
    location /assets/ {
        include security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback — all other paths serve index.html ──────────────────────
    location / {
        include security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
