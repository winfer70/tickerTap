# Deployment compose file — TickerTap standalone stack for the target deployment host.
#
# Self-contained (not an override file) to avoid Docker Compose's ambiguous
# list-merge semantics for `volumes:`/`networks:`/`ports:` across multiple
# -f files — same reasoning as the separate AI agent stack migration compose file.
#
# Reproduces the verified hybrid configuration from the existing deployment
# (a mix of docker-compose.yml + prod.yml settings per-service), plus adds
# the new containerized web tier + Cloudflare Tunnel that replace the old
# host-level nginx/certbot setup on the current production host.
#
# A remote systemd-based news worker talks to `app` directly over the
# configured API endpoint on port 8000, which is why that port stays
# published here exactly as it was on the current production host. Its
# TICKERTAP_API_URL must be updated to point at the replacement host during
# cutover (see tt-serverb-repoint).

networks:
  tickertap_net:
    driver: bridge
    ipam:
      config:
        # Must match the network's actual live subnet (verified via
        # `docker network inspect tickertap_tickertap_net`) — it is
        # 172.29.0.0/16 in prod, not the 10.51.0.0/16 originally planned
        # here. A mismatch makes `docker compose up` try to recreate the
        # network and fail with "active endpoints" since every tickerTap
        # container is still attached to it.
        - subnet: 172.29.0.0/16

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: tickertap_db
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:-tickerTap}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - tickertap_net
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: tickertap_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - tickertap_net
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tickertap_app
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickerTap}
      REDIS_URL:       redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://ticker-tap.com}
      # Falls back to host.docker.internal (the container's route to the host)
      # rather than a dummy placeholder, since SMTP is a host-native service
      # (ProtonMail Bridge) not yet running in a container. NOTE: Bridge must
      # be configured to accept connections beyond 127.0.0.1 (e.g. via a
      # socat forwarder) for this to actually work — see tt-smtp-bridge todo.
      SMTP_HOST:       ${SMTP_HOST:-host.docker.internal}
      OLLAMA_URL:      ${OLLAMA_URL:-http://<YOUR_OLLAMA_HOST>:11434}
      TRADING_ML_URL:  http://trading-ml:8001
      ADMIN_EMAILS:    ${ADMIN_EMAILS:-}
    # Bound to all interfaces (matches the current production host) so the
    # remote worker can connect directly for news ingestion/feedback rules.
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - tickertap_net
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets app reach host-native ProtonMail Bridge (SMTP)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-ml:
        condition: service_healthy

  trading-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tickertap_trading_worker
    restart: unless-stopped
    command: ["arq", "app.trading.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.trading.worker_healthcheck", "trading-worker", "600"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickerTap}
      REDIS_URL:       redis://redis:6379/0
      TRADING_ML_URL:  http://trading-ml:8001
      SKIP_MIGRATIONS: "1"
    networks:
      - tickertap_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro

  paper-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tickertap_paper_worker
    restart: unless-stopped
    command: ["arq", "app.trading.paper_worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.trading.worker_healthcheck", "paper-worker", "120"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickerTap}
      REDIS_URL:       redis://redis:6379/0
      SKIP_MIGRATIONS: "1"
    networks:
      - tickertap_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro

  # News scorer: RSS → Ollama (GPU host) → POST /api/v1/news/internal/news
  # Replaces the old remote systemd worker (last ingest 2026-08-25).
  # LIVE STACK: do not `compose up` this service — Compose tries to recreate
  # tickertap_tickertap_net and errors. Start with docker run --network tickertap_tickertap_net
  # (container tickertap_news_worker) or `docker start tickertap_news_worker`.
  news-worker:
    build:
      context: .
      dockerfile: server-b-worker/Dockerfile
    container_name: tickertap_news_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TICKERTAP_API_URL: http://app:8000
      OLLAMA_MODEL: ${NEWS_OLLAMA_MODEL:-hermes3:8b}
      NEWS_QUEUE_DIR: /data
      SKIP_MIGRATIONS: "1"
    networks:
      - tickertap_net
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - news_queue:/data

  alert-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tickertap_alert_worker
    restart: always
    command: ["arq", "app.trading.alert_worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.trading.worker_healthcheck", "alert-worker", "600"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickerTap}
      REDIS_URL:    redis://redis:6379/0
      SKIP_MIGRATIONS: "1"
    networks:
      - tickertap_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  trading-ml:
    build:
      context: ./trading-ml
      dockerfile: Dockerfile
    container_name: tickertap_trading_ml
    restart: unless-stopped
    networks:
      - tickertap_net
    volumes:
      - ml_checkpoints:/app/checkpoints
    healthcheck:
      test:     ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s

  # ── New: containerized web tier (replaces host nginx + certbot) ───────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: tickertap_web
    restart: always
    networks:
      - tickertap_net
    depends_on:
      app:
        condition: service_healthy

  # ── New: Cloudflare Tunnel (replaces router port-forwarding for 80/443) ──
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tickertap_cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TICKERTAP_CLOUDFLARE_TUNNEL_TOKEN:?TICKERTAP_CLOUDFLARE_TUNNEL_TOKEN is required}
    networks:
      - tickertap_net
    depends_on:
      web:
        condition: service_healthy

volumes:
  db_data:
  ml_checkpoints:
  news_queue:
